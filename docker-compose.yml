services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      YUKIT_PUBLIC_BASE_URL: http://localhost:8080
      YUKIT_API_BASE_URL: http://localhost:8080/api
      YUKIT_DATABASE_URL: postgresql+asyncpg://yukit:yukit@postgres:5432/yukit
      YUKIT_REDIS_URL: redis://redis:6379/0
      YUKIT_DEV_AUTH_ENABLED: "true"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  worker:
    build: .
    command: /entrypoint-worker.sh
    env_file:
      - path: .env
        required: false
    environment:
      YUKIT_DATABASE_URL: postgresql+asyncpg://yukit:yukit@postgres:5432/yukit
      YUKIT_REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: yukit
      POSTGRES_USER: yukit
      POSTGRES_PASSWORD: yukit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
