[project]
name = "yukit-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "aiosqlite>=0.20",
  "alembic>=1.14",
  "arq>=0.26",
  "authlib>=1.3",
  "asyncpg>=0.30",
  "email-validator>=2.2",
  "fastapi>=0.115",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "pydantic-settings>=2.7",
  "psycopg[binary]>=3.2",
  "regex>=2024.11",
  "redis>=5.2",
  "sqlalchemy[asyncio]>=2.0",
  "uvicorn>=0.32"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.8",
  "types-regex>=2024.11"
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]
